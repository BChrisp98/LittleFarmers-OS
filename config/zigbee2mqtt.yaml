version: 5

mqtt:
  base_topic: zigbee2mqtt
  # WARNING (2026-07-25): this IP is still just the EC2 instance's dynamic
  # public IP, NOT an Elastic IP. It already changed once (from
  # 63.178.68.2) after an instance restart, which silently broke every
  # already-provisioned device pointing at the old address. Until an
  # Elastic IP is attached to the instance, this will happen again on the
  # next restart. See Vendor-Liste.md.
  server: mqtt://18.193.124.166:1883

frontend:
  enabled: true
  port: 8080
  host: 0.0.0.0

advanced:
  log_level: info
  network_key: GENERATE
  pan_id: GENERATE
  ext_pan_id: GENERATE

homeassistant:
  enabled: false