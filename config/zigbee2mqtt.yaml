version: 5

mqtt:
  base_topic: zigbee2mqtt
  # Broker-Sicherheit Option B (Entscheidung 2026-08-15, siehe
  # docs/BROKER-SECURITY-PLAN.md): 63.184.28.93 war die Infrastruktur des
  # LIEFERANTEN, nicht unsere eigene - die vorige Version dieses
  # Kommentars ("FIXED... the EC2 instance") war schlicht falsch, das war
  # nie unsere eigene Instanz. Jetzt zeigt jedes Geraet ab Werk auf
  # unseren eigenen Server (18.159.76.112, wo auch das Backend laeuft) -
  # dort laesst allow_anonymous=false ohnehin keine Verbindung zu, bevor
  # das Geraet ueber pair-device.sh echte, kundeneigene Zugangsdaten
  # bekommen hat (siehe dort). Diese Startdatei ist also nur ein
  # Platzhalter, der erst nach der Kopplung durch echte Werte ersetzt wird.
  server: mqtt://18.159.76.112:1883

frontend:
  # Sicherheitsfund 2026-08-16: dieses Web-UI hat kein Login und war
  # bisher auf 0.0.0.0 erreichbar - jeder im selben WLAN wie der Kunde
  # (Familie, Gaeste, offenes/unsicheres Heimnetz) konnte darueber alle
  # Zigbee-Geraete sehen und steuern. Nichts im Produkt nutzt dieses
  # Interface tatsaechlich (die App spricht direkt ueber MQTT, nicht
  # ueber dieses Web-UI) - daher jetzt nur noch auf localhost erreichbar.
  # Fuer Support-Debugging bei einem konkreten Kunden weiterhin nutzbar
  # per SSH-Portweiterleitung/SSM, aber nicht mehr uebers Heimnetz offen.
  enabled: true
  port: 8080
  host: 127.0.0.1

# Off by default in Zigbee2MQTT - turned on 2026-09-06 for the app's own
# device-overview screen (lib/screens/device_overview_screen.dart), which
# needs to show which devices are actually reachable right now, not just
# which ones exist. Zigbee2MQTT periodically pings each device and
# publishes zigbee2mqtt/<friendly_name>/availability ({"state":"online"
# or "offline"}) - small extra radio traffic, worth it for real status
# instead of "was it ever paired" being the only signal we had.
#
# NOTE: this file is only installed on a device's very first setup (see
# install/05-services.sh's ConditionPathExists-style guard, added
# 2026-09-06 after a config-reset crash-loop bug) - an already-deployed
# device (like the one this was tested on the same night) needs this
# added manually once: `echo "availability: true" | sudo tee -a
# /opt/zigbee2mqtt/data/configuration.yaml && sudo systemctl restart
# zigbee2mqtt`. Only relevant for existing test devices; a fresh
# install/Golden Image gets it automatically from this file.
availability: true

advanced:
  log_level: info
  network_key: GENERATE
  pan_id: GENERATE
  ext_pan_id: GENERATE

homeassistant:
  enabled: false