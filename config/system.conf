# LittleFarmers OS – zentrale Konfiguration

HOSTNAME="littlefarmers"

# MQTT - Startwerte fuer ein frisch geflashtes Geraet (Lieferanten-
# Broker, geteilter Namensraum). Sobald der Kunde das Geraet in der App
# koppelt (siehe pair-device.sh, docs/ONBOARDING-PLAN.md Option A), werden
# beide Werte automatisch durch die dem Kundenkonto zugeordneten Werte
# ersetzt - kein manuelles Eintragen mehr noetig.
MQTT_SERVER="mqtt://63.184.28.93:1883"
MQTT_BASE_TOPIC="zigbee2mqtt"

# Backend, das pair-device.sh nach dem Kopplungsstatus dieses Geraets
# fragt (Konto-/Karma-/Pflanzen-Backend, NICHT der MQTT-Broker oben -
# dessen Standort ist eine separate, noch offene Entscheidung, siehe
# docs/BROKER-SECURITY-PLAN.md).
BACKEND_URL="http://18.159.76.112:8000"
PAIR_POLL_INTERVAL="5"

# Zigbee2MQTT
ZIGBEE2MQTT_PORT="8080"

# WLAN-Hotspot - bisher leer, das lief unbemerkt komplett offen (jeder in
# Funkreichweite waehrend der Ersteinrichtung konnte sich verbinden), weil
# wifi-fallback.sh diesen Wert vorher gar nicht an wifi-connect weitergab.
# Beides jetzt behoben (Sicherheitspruefung 2026-08-15). Dieses Passwort
# ist aktuell fuer JEDES Geraet gleich (aus demselben Golden Image geklont)
# - fuer eine spaetere Serienfertigung waere ein zufaelliges Passwort pro
# Geraet (z.B. auf einem Aufkleber, wie der Pairing-Code) sicherer, aber
# das ist ein Logistik-/Produktionsschritt, kein Software-Thema mehr - mit
# diesem einen, echten Passwort ist der Hotspot immerhin kein offenes Netz.
HOTSPOT_SSID="LittleFarmers"
HOTSPOT_PASSWORD="LittleFarmers2026!"
CAPTIVE_PORT="80"

# Fallback
NO_INTERNET_TIMEOUT="180"
HOTSPOT_RUNTIME="900"
CHECK_INTERVAL="30"

# Verbindungstest
CONNECTIVITY_HOST="1.1.1.1"