# LittleFarmers: lokaler Broker fuer Shelly im Heimnetz.
# Bewusst ohne Passwort: nur fuer das eigene Heimnetz gedacht (Gen1-Shelly
# koennen ohnehin kein TLS). Ueber die Bridge (littlefarmers-bridge.conf)
# geht alles verschluesselt zum Server und nur unter dem eigenen Namensraum.
listener 1883
allow_anonymous true
